<style>
  :root {
    --bg: #f6f6fb; --surface: #ffffff; --border: #e4e3f0;
    --text: #1b1f4a; --text-dim: #5a5f7a; --accent: #4b3fb8;

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.75;
    font-family: "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", "Meiryo", system-ui, sans-serif;

  a { color: var(--accent); }
  .wrap { width: min(880px, 100% - 32px); margin: 0 auto; }

    position: relative; color: #fff; text-align: center; padding: 96px 0 88px;

  .hero::after { content: ""; position: absolute; inset: 0; background: rgba(20, 18, 60, .35); }
  .hero .wrap { position: relative; z-index: 1; }
  .hero h1 { margin: 0 0 8px; font-size: clamp(34px, 6vw, 52px); letter-spacing: .03em; text-shadow: 0 2px 16px rgba(20, 18, 60, .45); }
  .hero p { margin: 0; font-size: clamp(15px, 2.4vw, 18px); color: rgba(255, 255, 255, .95); }

  section { padding: 56px 0 0; }
  h2 { font-size: 24px; margin: 0 0 20px; }

  .app {
    display: grid; grid-template-columns: 96px 1fr; gap: 20px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px;
    text-decoration: none; color: var(--text); box-shadow: var(--shadow); transition: transform .15s ease;
  }
  .app:hover { transform: translateY(-2px); }
  .app img { width: 96px; height: 96px; display: block; }
  .app h3 { margin: 0; font-size: 20px; }
  .app p { margin: 4px 0 8px; color: var(--text-dim); font-size: 15px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--border); color: var(--text-dim); }
  @media (max-width: 520px) { .app { grid-template-columns: 64px 1fr; } .app img { width: 64px; height: 64px; } }

  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  .links a {
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    text-decoration: none; color: var(--text); font-size: 15px;
  }
  .links a:hover { border-color: var(--accent); }

  footer { padding: 56px 0 40px; text-align: center; color: var(--text-dim); font-size: 14px; }
